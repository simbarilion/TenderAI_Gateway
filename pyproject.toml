[project]
name = "tenderai-gateway"
version = "0.1.0"
description = ""
authors = [
    {name = "simbarilion",email = "nadezhda13popova@gmail.com"}
]
requires-python = ">=3.13,<3.15"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.52.4,<0.53.0)",
    "sqlalchemy (>=2.0.52,<3.0.0)",
    "alembic (>=1.19.1,<2.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "redis (>=8.1.0,<9.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[dependency-groups]
lint = [
    "ruff (>=0.16.4,<0.17.0)",
    "pre-commit (>=4.6.2,<5.0.0)"
]

[tool.ruff]
line-length = 119
target-version = "py312"
exclude = [
    ".git",
    "__pycache__",
    "venv",
    ".venv",
    "env",
    ".env",
    "alembic/versions",
    "alembic/env.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

ignore = [
    "E203",
    "E701",
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
"alembic/versions/*.py" = ["E501", "F401", "E402", "W291"]

[tool.ruff.lint.isort]
combine-as-imports = true
split-on-trailing-comma = true


[tool.poetry]
packages = [{ include = "app" }]
